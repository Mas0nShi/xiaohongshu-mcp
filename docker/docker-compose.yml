services:
  xiaohongshu-mcp:
    # Docker Hub 镜像（默认）
    image: xpzouying/xiaohongshu-mcp
    # 阿里云镜像源（国内用户推荐，拉取更快）
    # image: crpi-hocnvtkomt7w9v8t.cn-beijing.personal.cr.aliyuncs.com/xpzouying/xiaohongshu-mcp
    container_name: xiaohongshu-mcp
    restart: unless-stopped
    init: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./images:/app/images
    environment:
      - ROD_BROWSER_BIN=/usr/local/bin/cloak-chromium
      - COOKIES_PATH=/app/data/cookies.json
      - HOME=/app/data/home
      - XDG_CACHE_HOME=/app/data/cache
      - XDG_CONFIG_HOME=/app/data/config
      # Chromium 单实例通常会占用数百 MB；默认串行执行，避免并发调用耗尽内存。
      - XHS_BROWSER_CONCURRENCY=${XHS_BROWSER_CONCURRENCY:-1}
      # 可选：启用 Bearer token 鉴权。启用后访问 /mcp 和 /api/v1 需要：
      # Authorization: Bearer your-secret-token
      # - MCP_BEARER_TOKEN=your-secret-token
    ports:
      - "18060:18060"
